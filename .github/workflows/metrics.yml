name: Metrics
on:
  # Regenerate the calendar every day at 00:00 UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate on push to main so setup changes apply immediately
  push: {branches: ["main"]}

permissions:
  contents: write

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alexgaoth
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
